[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oarp"
version = "0.0.1"
description = "Observable Agentic RAG Platform: a small, evaluated agent harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
oarp = "oarp.cli:main"

[project.optional-dependencies]
anthropic = ["anthropic>=1.17,<2"]
dev = ["pytest>=8", "anthropic>=1.17,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "docker: needs a running Docker daemon and the oarp-sandbox image (skipped otherwise)",
    "live: makes real, paid API calls; runs only with OARP_LIVE_TESTS=1",
]
